<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- A assinatura do app é o grid do ano com stickers: faixas de mês e
       marcações de cores diferentes. Poucas formas e bem grossas, porque isso
       precisa continuar legível nos 16px da aba do browser — as faixas vazias
       usam o bege de fim de semana, senão somem no fundo do papel. -->
  <rect width="32" height="32" fill="#FBF9F5"/>
  <rect x="1.5" y="1.5" width="29" height="29" fill="none" stroke="#C9B79F" stroke-width="2"/>

  <g fill="#E5DCD0">
    <rect x="5" y="6" width="22" height="6"/>
    <rect x="5" y="13" width="22" height="6"/>
    <rect x="5" y="20" width="22" height="6"/>
  </g>

  <rect x="5" y="6" width="10" height="6" fill="#C1654F"/>
  <rect x="17" y="13" width="10" height="6" fill="#6B7F5C"/>
  <rect x="5" y="20" width="6" height="6" fill="#4A6E7E"/>
  <rect x="13" y="20" width="6" height="6" fill="#C79A45"/>
</svg>
